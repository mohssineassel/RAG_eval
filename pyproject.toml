    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
]
